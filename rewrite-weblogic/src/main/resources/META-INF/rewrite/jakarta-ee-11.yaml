type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.jakarta.UpgradeMavenPluginConfigurationArtifactsToJakartaEE11
displayName: Migrate Java EE API Maven plugin configuration artifacts to Jakarta EE 11
description: Replace the legacy Java EE aggregate API artifact in Maven plugin execution configuration with the Jakarta EE 11 aggregate API artifact.
tags:
  - jakarta
  - dependencies
  - maven
recipeList:
  - com.oracle.weblogic.rewrite.jakarta.UpgradeMavenPluginArtifactItems:
      oldGroupId: javax
      oldArtifactId: javaee-api
      newGroupId: jakarta.platform
      newArtifactId: jakarta.jakartaee-api
      newVersion: 11.0.0
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.jakarta.PreserveLegacyBeansXmlDiscoveryMode
displayName: Preserve legacy CDI bean discovery mode
description: Preserve the effective `all` discovery mode of existing pre-CDI 4 `beans.xml` descriptors when migrating to CDI 4.1.
tags:
  - jakarta
  - cdi
  - beans
recipeList:
  - org.openrewrite.java.migrate.BeanDiscovery
  - com.oracle.weblogic.rewrite.jakarta.PreserveVersionedLegacyBeansXmlDiscoveryMode
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.jakarta.PreserveVersionedLegacyBeansXmlDiscoveryMode
displayName: Preserve versioned legacy CDI bean discovery mode
description: Add an explicit `all` discovery mode to an existing CDI 1.x, 2.x, or 3.x `beans.xml` descriptor that does not specify one.
tags:
  - jakarta
  - cdi
  - beans
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/beans.xml'
  - org.openrewrite.xml.search.FindTags:
      xPath: /beans[not(@bean-discovery-mode) and (@version = '1.0' or @version = '1.1' or @version = '2.0' or @version = '3.0')]
recipeList:
  - org.openrewrite.xml.AddTagAttribute:
      elementName: beans
      attributeName: bean-discovery-mode
      newValue: all
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.jakarta.MigrateWebXmlToJakartaEE11
displayName: Migrate `web.xml` to Jakarta EE 11
description: Update the namespace, schema location, and version in `web.xml` to Jakarta Servlet 6.1.
tags:
  - jakarta
  - servlet
  - webxml
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/web.xml'
recipeList:
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: web-app
      attributeName: version
      newValue: 6.1
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: web-app
      attributeName: xmlns
      newValue: https://jakarta.ee/xml/ns/jakartaee
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: web-app
      attributeName: xmlns:xsi
      newValue: http://www.w3.org/2001/XMLSchema-instance
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: web-app
      attributeName: xsi:schemaLocation
      newValue: https://jakarta.ee/xml/ns/jakartaee https://jakarta.ee/xml/ns/jakartaee/web-app_6_1.xsd
  - org.openrewrite.text.FindAndReplace:
      find: javax.
      replace: jakarta.
      filePattern: '**/web.xml'
  - org.openrewrite.text.FindAndReplace:
      find: jakarta.sql.
      replace: javax.sql.
      filePattern: '**/web.xml'
---
