type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.spring.framework.UseWebLogicJtaTransactionManagerForSpring7
displayName: Use Spring's WebLogic JTA transaction manager
description: Use Spring's WebLogic-specific JTA transaction manager when the WebLogic Spring 7 migration lane is explicitly activated.
tags:
  - springframework
  - weblogic
  - transactions
recipeList:
  - com.oracle.weblogic.rewrite.spring.framework.UseWebLogicJtaTransactionManagerForSpring7JavaConfig
  - org.openrewrite.xml.ChangeTagAttribute:
      elementName: bean
      attributeName: class
      oldValue: org.springframework.transaction.jta.JtaTransactionManager
      newValue: org.springframework.transaction.jta.WebLogicJtaTransactionManager
