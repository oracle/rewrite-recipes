type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.WebLogicXmlWebAppNamespace2610
displayName: Migrate `weblogic.xml` to the WebLogic 26.1.0 schema
description: Update the namespace and schema location in `weblogic.xml` for WebLogic 26.1.0.
tags:
  - weblogic
  - web-app
  - schemas
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/weblogic.xml'
recipeList:
  - org.openrewrite.xml.ChangeTagAttribute:
      attributeName: xmlns
      elementName: weblogic-web-app
      newValue: http://xmlns.oracle.com/weblogic/weblogic-web-app
  - org.openrewrite.xml.ChangeTagAttribute:
      attributeName: xmlns:wls
      elementName: weblogic-web-app
      newValue: http://xmlns.oracle.com/weblogic/weblogic-web-app
  - org.openrewrite.xml.ChangeTagAttribute:
      attributeName: xmlns:xsi
      elementName: weblogic-web-app
      newValue: http://www.w3.org/2001/XMLSchema-instance
  - org.openrewrite.xml.ChangeTagAttribute:
      attributeName: xsi:schemaLocation
      elementName: weblogic-web-app
      newValue: http://xmlns.oracle.com/weblogic/weblogic-web-app http://xmlns.oracle.com/weblogic/weblogic-web-app/2.0/weblogic-web-app.xsd
  - org.openrewrite.text.FindAndReplace:
      find: javax.
      replace: jakarta.
      filePattern: '**/weblogic.xml'
---
