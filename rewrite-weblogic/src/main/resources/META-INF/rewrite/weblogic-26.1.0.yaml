type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.UpdateBuildToWebLogic2610
displayName: Update the WebLogic version to 26.1.0
description: This recipe will update the WebLogic version to 26.1.0 for a Maven build.
recipeList:
  - org.openrewrite.maven.ChangePropertyValue:
      key: weblogic.version
      newValue: 26.1.0-0-0
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: com.oracle.weblogic.archetype
      artifactId: '*'
      newVersion: 26.1.0-0-0
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: com.oracle.weblogic
      artifactId: '*'
      newVersion: 26.1.0-0-0
      trustParent: "True"
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: com.oracle.weblogic
      artifactId: '*'
      newVersion: 26.1.0-0-0
  - com.oracle.weblogic.rewrite.UpdateExistingMavenWrapperFor2610
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.UpdateExistingMavenWrapperFor2610
displayName: Update an existing Maven Wrapper for WebLogic 26.1.0
description: Update an existing Maven Wrapper to versions compatible with the WebLogic 26.1.0 build.
recipeList:
  - org.openrewrite.maven.UpdateMavenWrapper:
      wrapperVersion: 3.3.4
      distributionVersion: 3.9.16
      addIfMissing: false
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.NormalizeWebLogic2610DependencyScopes
displayName: Normalize dependency scopes for WebLogic 26.1.0
description: Normalize application dependency scopes for APIs provided by WebLogic 26.1.0.
tags:
  - weblogic
  - dependencies
  - scopes
recipeList:
  - com.oracle.weblogic.rewrite.ChangeJakartaInjectAPIDependencyScopeFor2610
  - com.oracle.weblogic.rewrite.ChangeJakartaRestAPIDependencyScopeFor2610
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.ChangeJakartaInjectAPIDependencyScopeFor2610
displayName: Use the provided scope for Jakarta Dependency Injection on WebLogic 26.1.0
description: Change `jakarta.inject-api` to provided when the Jakarta EE 11 platform API is provided by WebLogic 26.1.0.
tags:
  - weblogic
  - jakarta
  - dependency-injection
preconditions:
  - org.openrewrite.java.dependencies.DependencyInsight:
      groupIdPattern: jakarta.platform
      artifactIdPattern: jakarta.jakartaee-api
      version: 11.x
      scope: provided
      onlyDirect: true
  - org.openrewrite.xml.search.FindTags:
      xPath: /project/dependencies/dependency[groupId='jakarta.platform' and artifactId='jakarta.jakartaee-api' and scope='provided']
recipeList:
  - org.openrewrite.maven.ChangeDependencyScope:
      groupId: jakarta.inject
      artifactId: jakarta.inject-api
      newScope: provided
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.ChangeJakartaRestAPIDependencyScopeFor2610
displayName: Use the provided scope for Jakarta REST on WebLogic 26.1.0
description: Change `jakarta.ws.rs-api` to provided when the Jakarta EE 11 platform API is provided by WebLogic 26.1.0.
tags:
  - weblogic
  - jakarta
  - rest
