type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindPreferWebInfClassesOverride2610
displayName: Find WebLogic web application classloading overrides
description: Report enabled `prefer-web-inf-classes` settings that require classloading review for WebLogic 26.1.0.
tags:
  - weblogic
  - descriptors
  - classloading
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/weblogic.xml'
recipeList:
  - org.openrewrite.xml.search.FindTags:
      xPath: /weblogic-web-app/container-descriptor/prefer-web-inf-classes[text()='true']
