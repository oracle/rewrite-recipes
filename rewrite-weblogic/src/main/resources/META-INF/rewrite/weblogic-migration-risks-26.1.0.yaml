type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindWebLogic2610MigrationRisks
displayName: Find WebLogic 26.1.0 migration risks
description: Report application-specific migration risks that require review when upgrading to WebLogic 26.1.0.
tags:
  - weblogic
  - migration
  - security
recipeList:
  - com.oracle.weblogic.rewrite.FindJavaSecurityManagerStartupOption2610
  - com.oracle.weblogic.rewrite.FindJavaSecurityPolicyStartupOption2610
  - com.oracle.weblogic.rewrite.FindApplicationSecurityPolicyFiles2610
  - com.oracle.weblogic.rewrite.FindCustomSecurityManagerImplementations2610
  - com.oracle.weblogic.rewrite.FindCompileScopedWebLogicDependencies2610
  - com.oracle.weblogic.rewrite.FindRuntimeScopedWebLogicDependencies2610
  - com.oracle.weblogic.rewrite.FindPreferWebInfClassesOverride2610
  - com.oracle.weblogic.rewrite.FindPreferApplicationPackagesOverride2610
  - com.oracle.weblogic.rewrite.FindPreferApplicationResourcesOverride2610
  - com.oracle.weblogic.rewrite.FindNonTransactionalJdbcDataSources2610
  - com.oracle.weblogic.rewrite.FindOnePhaseCommitJdbcDataSources2610
  - com.oracle.weblogic.rewrite.FindEmulateTwoPhaseCommitJdbcDataSources2610
  - com.oracle.weblogic.rewrite.FindLoggingLastResourceJdbcDataSources2610
  - com.oracle.weblogic.rewrite.FindRemovedJakartaEE11Apis2610
  - com.oracle.weblogic.rewrite.FindManagedBeanAnnotations2610
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindJavaSecurityManagerStartupOption2610
displayName: Find Java Security Manager startup options
description: Report `-Djava.security.manager` startup options that require manual review for JDK 25.
tags:
  - weblogic
  - java
  - security-manager
recipeList:
  - org.openrewrite.text.Find:
      find: -Djava.security.manager
      caseSensitive: true
      filePattern: '**/*.sh;**/*.cmd;**/*.bat;**/*.properties'
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindJavaSecurityPolicyStartupOption2610
displayName: Find Java security policy startup options
description: Report `-Djava.security.policy` startup options that require manual review for JDK 25.
tags:
  - weblogic
  - java
  - security-manager
recipeList:
  - org.openrewrite.text.Find:
      find: -Djava.security.policy
      caseSensitive: true
      filePattern: '**/*.sh;**/*.cmd;**/*.bat;**/*.properties'
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindApplicationSecurityPolicyFiles2610
displayName: Find application security policy files
description: Report application `.policy` files whose permission and sandboxing behavior requires manual review for JDK 25.
tags:
  - weblogic
  - java
  - security-manager
recipeList:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/*.policy'
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindCustomSecurityManagerImplementations2610
displayName: Find custom Security Manager implementations
description: Report custom `SecurityManager` implementations whose authorization and sandboxing behavior requires manual review for JDK 25.
tags:
  - weblogic
  - java
  - security-manager
recipeList:
  - org.openrewrite.java.search.FindImplementations:
      typeName: java.lang.SecurityManager
---
type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindCompileScopedWebLogicDependencies2610
displayName: Find compile-scoped WebLogic dependencies
description: Report direct compile-scoped WebLogic dependencies that may package server APIs with the application.
tags:
  - weblogic
  - dependencies
  - classloading
recipeList:
  - org.openrewrite.java.dependencies.DependencyInsight:
      groupIdPattern: com.oracle.weblogic
      artifactIdPattern: '*'
      scope: compile
      onlyDirect: true
---
