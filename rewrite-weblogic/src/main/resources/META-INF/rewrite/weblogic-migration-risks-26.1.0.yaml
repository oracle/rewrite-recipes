type: specs.openrewrite.org/v1beta/recipe
name: com.oracle.weblogic.rewrite.FindNonTransactionalJdbcDataSources2610
displayName: Find non-transactional WebLogic JDBC data sources
description: Report WebLogic JDBC data sources configured without a global transaction protocol for manual transaction review.
tags:
  - weblogic
  - jdbc
  - transactions
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/*-jdbc.xml'
recipeList:
  - org.openrewrite.xml.search.FindTags:
      xPath: /jdbc-data-source/jdbc-data-source-params/global-transactions-protocol[text()='None']
